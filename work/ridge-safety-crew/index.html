<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Ridge's Safety Crew | A kids' safety game from StoneRiver</title>
<meta name="description" content="A free 2-part safety game for kids starring Ridge the buck, StoneRiver's mascot. Learn about power lines, gas smells, calling 811 and spotting utilities, then print your Junior Safety Crew badge.">
<link rel="canonical" href="https://stoneriversystems.github.io/work/ridge-safety-crew/">
<meta name="theme-color" content="#FFC21A">
<link rel="icon" href="../../favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one big "job site" card on a hi-vis ground; Ridge (always full body) stands beside the question and reacts. Single bright look on purpose (ink drawings need a light ground). */
:root {
  --hivis: #FFC21A;
  --stripe: #F26B1D;
  --navy: #1F3A5F;
  --paper: #FFFDF6;
  --ink: #1E1A17;
  --good: #1E7A46;
  --oops: #B4321A;
  --soft: #F3EBD6;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--hivis); color: var(--ink);
  font-family: var(--body); font-weight: 600; font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
.tape { height: 22px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 24px;
  background: repeating-linear-gradient(-45deg, var(--ink) 0 18px, var(--hivis) 18px 36px); }
main { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand .co { font-family: var(--display); color: var(--navy); font-size: 20px; letter-spacing: 1.5px; }
.progress { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.progress .part { font-family: var(--display); color: var(--navy); font-size: 15px; letter-spacing: 1px; margin-right: 4px; }
.progress span.dot { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); }
.progress span.done { background: var(--stripe); }
.progress span.now { background: var(--navy); }

.card {
  background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 8px 8px 0 var(--ink);
  padding: 28px; display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 28px; align-items: center;
}
.ridge { display: flex; justify-content: center; align-items: flex-end; }
.ridge img { display: block; height: 380px; width: auto; max-width: 100%; object-fit: contain; transform-origin: 50% 100%; }
.ridge img.bounce { animation: bounce .6s ease; }
.ridge img.shake { animation: shake .5s ease; }
@keyframes bounce { 0%{transform:none} 30%{transform:translateY(-18px) scale(1.04,.96)} 60%{transform:scale(.97,1.03)} 100%{transform:none} }
@keyframes shake { 0%,100%{transform:none} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }
@media (prefers-reduced-motion: reduce) { .ridge img.bounce, .ridge img.shake { animation: none; } }

.content { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(38px, 7vw, 62px); color: var(--navy); }
h2 { font-size: clamp(24px, 4vw, 32px); }
.bubble { background: var(--soft); border: 3px solid var(--ink); border-radius: 18px; padding: 14px 18px; font-size: 19px; }
.label { font-family: var(--display); color: var(--stripe); letter-spacing: 1.5px; font-size: 16px; text-transform: uppercase; }
.parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.parts div { border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; background: #fff; }
.parts b { font-family: var(--display); font-weight: 400; color: var(--navy); font-size: 20px; display: block; }

.spot { position: relative; border: 3px solid var(--ink); border-radius: 18px; background: #EAF4FB; display: flex; justify-content: center; padding: 10px; }
.spot svg { width: 220px; height: 200px; max-width: 100%; }
.spot .tag { position: absolute; left: -10px; top: 50%; transform: translateY(-50%); background: var(--stripe); color: #fff;
  font-family: var(--display); font-size: 15px; letter-spacing: 1px; padding: 6px 12px 6px 14px; border: 3px solid var(--ink); border-radius: 10px; }

.choices { display: flex; flex-direction: column; gap: 12px; }
.choice { font: inherit; font-weight: 800; font-size: 19px; text-align: left; color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 12px 18px; min-height: 54px; cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.choice:hover:not(:disabled) { background: #FFF2C4; }
.choice:active:not(:disabled) { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
.choice:focus-visible, .btn:focus-visible, input:focus-visible, .linkbtn:focus-visible { outline: 4px solid var(--navy); outline-offset: 3px; }
.choice:disabled { cursor: default; opacity: .55; }
.choice.right { background: #D8F2E1; border-color: var(--good); opacity: 1; }
.choice.wrong { background: #F9DCD5; border-color: var(--oops); opacity: 1; }
.feedback { border-radius: 14px; padding: 12px 16px; border: 3px solid; display: flex; gap: 14px; align-items: center; }
.feedback img { width: 76px; height: 76px; object-fit: contain; flex: none; background: #fff; border: 3px solid var(--ink); border-radius: 50%; padding: 4px; }
.feedback.good { border-color: var(--good); background: #D8F2E1; }
.feedback.bad { border-color: var(--oops); background: #F9DCD5; }
.feedback strong { font-family: var(--display); font-weight: 400; font-size: 23px; display: block; }
.btn, .linkbtn { font-family: var(--display); font-size: 22px; letter-spacing: 1px; color: #fff; text-decoration: none;
  background: var(--navy); border: 4px solid var(--ink); border-radius: 16px; padding: 10px 24px; min-height: 54px; cursor: pointer;
  box-shadow: 5px 5px 0 var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.btn:active, .linkbtn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--ink); }
.btn.orange { background: var(--stripe); }
.btn.plain { background: var(--paper); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { font: inherit; font-size: 19px; padding: 10px 14px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; max-width: 360px; }
.badge { border: 5px dashed var(--navy); border-radius: 20px; padding: 16px 20px; background: #FFF6D6; display: flex; flex-direction: column; gap: 4px; text-align: center; }
.badge .who { font-family: var(--display); font-size: clamp(30px, 5vw, 44px); color: var(--navy); line-height: 1.05; overflow-wrap: anywhere; }
.badge .title { font-family: var(--display); color: var(--stripe); font-size: 22px; letter-spacing: 2px; }
.score { font-family: var(--display); font-size: 22px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.send { border-top: 3px dashed var(--ink); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.send h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; color: var(--navy); }
.small { font-size: 15px; color: #4A4540; }
.status { font-size: 16px; font-weight: 800; min-height: 1.2em; }
.foot { text-align: center; font-size: 14px; color: var(--navy); }
.foot a, .brand a.co { color: var(--navy); text-decoration: none; }
.foot a { text-decoration: underline; }
.print-only { display: none; }
@media print {
  @page { size: letter landscape; margin: 0.5in; }
  body { background: #fff; padding: 0; }
  body > *:not(#printBadge) { display: none !important; }
  #printBadge { display: flex !important; align-items: center; gap: 0.4in; border: 6px dashed #1F3A5F; border-radius: 24px;
    padding: 0.4in; height: 6.6in; box-sizing: border-box; background: #FFF6D6; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #printBadge img { height: 5.2in; width: auto; }
  .pb-text { flex: 1; text-align: center; display: flex; flex-direction: column; gap: 0.12in; }
  .pb-small, .pb-title { font-family: var(--display); color: var(--stripe); letter-spacing: 3px; }
  .pb-small { font-size: 28pt; }
  .pb-title { font-size: 34pt; }
  .pb-name { font-family: var(--display); color: var(--navy); font-size: 60pt; line-height: 1; overflow-wrap: anywhere; }
  .pb-score { font-size: 18pt; font-weight: 800; }
  .pb-approved { font-size: 16pt; }
}
@media (max-width: 700px) {
  .card { grid-template-columns: minmax(0,1fr); padding: 18px; gap: 14px; box-shadow: 5px 5px 0 var(--ink); }
  .ridge img { height: 200px; }
  .parts { grid-template-columns: minmax(0,1fr); }
}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<main>
  <div class="brand">
    <a class="co" href="../../#work">STONERIVER ENERGY SERVICES</a>
    <div class="progress" id="progress"></div>
  </div>
  <section class="card" aria-live="polite">
    <div class="ridge"><img id="ridgeImg" src="img/ridge-wave.png" alt="Ridge the buck waving hello"></div>
    <div class="content" id="content"></div>
  </section>
  <p class="foot">Ridge's Safety Crew · a StoneRiver community game · Ask a grown-up if you're ever unsure!<br>This game doesn't collect or save any information. · <a href="../../">StoneRiver home</a></p>
</main>
<div id="printBadge" class="print-only" aria-hidden="true">
  <img src="img/ridge-wave.png" alt="">
  <div class="pb-text">
    <div class="pb-small">OFFICIAL</div>
    <div class="pb-name" id="pbName">Safety Star</div>
    <div class="pb-title">JUNIOR SAFETY CREW</div>
    <div class="pb-score" id="pbScore"></div>
    <div class="pb-approved">Approved by Ridge • StoneRiver Safety Team</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
